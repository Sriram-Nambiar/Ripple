name: Ripple PR Impact Radar

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number to analyze'
        required: true
        default: '3'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  impact-analysis:
    name: Blast-Radius & Architectural Risk Radar
    runs-on: ubuntu-latest
    if: github.repository == 'harsh200623/Ripple'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Run Ripple PR Impact Analysis & Comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REPO_FULL_NAME: ${{ github.repository }}
          RIPPLE_WEB_URL: https://ripple-y3zm.onrender.com
        run: npx tsx scripts/pr-bot.ts
